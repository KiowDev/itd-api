name: Публикация @itd-api/testing в npm

# Запускается при пуше тега вида testing-v1.2.3.
# Порядок выпуска:
#   npm version patch --workspace @itd-api/testing --no-git-tag-version
#   git commit -am "@itd-api/testing 0.0.2"
#   git tag testing-v0.0.2
#   git push --follow-tags
on:
  push:
    tags: ['testing-v*']

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-workspace.yml
    with:
      package_name: '@itd-api/testing'
      package_path: packages/testing
      tag_prefix: testing-v
