name: Публикация workspace-пакета

on:
  workflow_call:
    inputs:
      package_name:
        description: Полное имя npm-пакета
        required: true
        type: string
      package_path:
        description: Путь к пакету от корня репозитория
        required: true
        type: string
      tag_prefix:
        description: Префикс git-тега вместе с завершающим дефисом
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tag:
    name: Тег совпадает с версией пакета
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Сверка тега и версии
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          case "$GITHUB_REF_NAME" in
            "$TAG_PREFIX"*) ;;
            *)
              echo "Тег $GITHUB_REF_NAME не начинается с $TAG_PREFIX"
              exit 1
              ;;
          esac

          TAG="${GITHUB_REF_NAME#"$TAG_PREFIX"}"
          PKG="$(node -e "console.log(require('./' + process.argv[1] + '/package.json').version)" "$PACKAGE_PATH")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией $PKG в $PACKAGE_PATH/package.json"
            exit 1
          fi
          echo "Публикуется версия $PKG"

  checks:
    needs: verify-tag
    uses: ./.github/workflows/checks.yml

  publish:
    name: Публикация
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Обновление npm до версии с поддержкой Trusted Publishing
        run: |
          npm install -g npm@latest
          npm -v

      - run: npm ci

      - name: Публикация
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: npm publish --workspace "$PACKAGE_NAME"
