name: Публикация @itd-api/proxy в npm

# Запускается при пуше тега вида proxy-v1.2.3.
# Порядок выпуска:
#   npm version patch --workspace @itd-api/proxy --no-git-tag-version
#   git commit -am "@itd-api/proxy 0.0.2"
#   git tag proxy-v0.0.2
#   git push --follow-tags
on:
  push:
    tags: ['proxy-v*']

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-workspace.yml
    with:
      package_name: '@itd-api/proxy'
      package_path: packages/proxy
      tag_prefix: proxy-v
