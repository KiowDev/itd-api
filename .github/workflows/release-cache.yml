name: Публикация @itd-api/cache в npm

# Запускается при пуше тега вида cache-v1.2.3.
# Порядок выпуска:
#   npm version patch --workspace @itd-api/cache --no-git-tag-version
#   git commit -am "@itd-api/cache 0.0.2"
#   git tag -a cache-v0.0.2 -m "@itd-api/cache 0.0.2"
#   git push --follow-tags
on:
  push:
    tags: ['cache-v*']

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-workspace.yml
    with:
      package_name: '@itd-api/cache'
      package_path: packages/cache
      tag_prefix: cache-v
