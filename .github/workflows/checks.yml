name: Проверки

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Линтер, типы и тесты
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Типы
        run: |
          npm run typecheck
          npm run typecheck --workspaces --if-present

      - name: Линтер и форматирование
        run: npm run lint

      - name: Направление импортов между слоями
        run: npm run check:layers

      - name: Тесты
        run: npm test

      - name: Тесты пакетов workspace
        run: npm run test --workspaces --if-present

  build:
    name: Сборка пакета и документации
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Сборка
        run: npm run build

      - name: Документация
        run: npm run docs:check

      - name: Корректность пакета
        run: npm run check:pack

      - name: Проверки пакетов workspace
        run: |
          npm run build --workspaces --if-present
          npm run check:pack --workspaces --if-present

      - name: Упаковка тарболла
        run: |
          mkdir -p pack
          npm pack --pack-destination ./pack

      - name: Публикация тарболла как артефакта
        uses: actions/upload-artifact@v7
        with:
          name: pack
          path: pack/*.tgz
          retention-days: 1

  # Минимальная поддерживаемая версия — Node 18 (см. engines в package.json).
  # Проверяется ровно то, что получит пользователь: установка собранного тарболла
  # и импорт обеих точек входа в обоих форматах.
  smoke:
    name: Собранный пакет на Node ${{ matrix.node }}
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24, 26]

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: pack
          path: pack

      - name: Установка пакета в чистый проект
        run: |
          mkdir smoke
          cd smoke
          npm init -y > /dev/null
          npm install ../pack/*.tgz

      - name: Импорт собранного пакета
        working-directory: smoke
        run: |
          node -e "const m = require('itd-api'); if (typeof m.ItdClient !== 'function') { throw new Error('CJS-сборка не отдаёт ItdClient'); }"
          node --input-type=module -e "import { ItdClient } from 'itd-api'; if (typeof ItdClient !== 'function') { throw new Error('ESM-сборка не отдаёт ItdClient'); }"
          node -e "const { ItdClient } = require('itd-api'); const key = Symbol.asyncDispose || Symbol.for('Symbol.asyncDispose'); if (typeof ItdClient.prototype[key] !== 'function') { throw new Error('ItdClient не disposable на текущем runtime'); }"
          node --input-type=module -e "import { ItdClient } from 'itd-api'; const key = Symbol.asyncDispose || Symbol.for('Symbol.asyncDispose'); if (typeof ItdClient.prototype[key] !== 'function') { throw new Error('ItdClient не disposable на текущем runtime'); }"
          node -e "const { createRestClient } = require('itd-api/rest'); if (typeof createRestClient !== 'function') { throw new Error('CJS-сборка не отдаёт createRestClient'); }"
          node --input-type=module -e "import { createRestClient, bearerToken } from 'itd-api/rest'; if (typeof createRestClient !== 'function' || typeof bearerToken !== 'function') { throw new Error('ESM-сборка не отдаёт минимальный клиент'); }"
          node --input-type=module -e "import * as rest from 'itd-api/rest'; for (const name of ['ItdClient', 'ItdAccounts', 'ItdRealtime', 'MemoryTokenStorage']) { if (name in rest) throw new Error('itd-api/rest снова тянет ' + name); }"
          node -e "const { createRealtimeClient } = require('itd-api/realtime'); if (typeof createRealtimeClient !== 'function') { throw new Error('CJS-сборка не отдаёт createRealtimeClient'); }"
          node --input-type=module -e "import * as rt from 'itd-api/realtime'; for (const name of ['ItdClient', 'ItdAccounts', 'createRestClient', 'MemoryTokenStorage']) { if (name in rt) throw new Error('itd-api/realtime снова тянет ' + name); }"
          node -e "require('itd-api/node');"
          node --input-type=module -e "await import('itd-api/node');"
          node -e "require('itd-api/web');"
          node --input-type=module -e "await import('itd-api/web');"
          node --input-type=module -e "import { FileTokenStorage, FileMultiTokenStorage, fromPath } from 'itd-api/node'; import { LocalStorageTokenStorage } from 'itd-api/web'; for (const [name, value] of Object.entries({ FileTokenStorage, FileMultiTokenStorage, fromPath, LocalStorageTokenStorage })) { if (value === undefined) throw new Error(name + ' не экспортируется'); }"
          node --input-type=module -e "import * as node from 'itd-api/node'; if ('ItdClient' in node) { throw new Error('itd-api/node снова переэкспортирует основной API'); }"
