name: Документация

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка документации
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run docs:build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: guides/.vitepress/dist

  deploy:
    name: Публикация документации
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v5
