name: Публикация @itd-api/chat-bot в npm

# Запускается при пуше тега вида chat-bot-v1.2.3.
# Порядок выпуска:
#   npm version patch --workspace @itd-api/chat-bot --no-git-tag-version
#   git commit -am "@itd-api/chat-bot 0.0.2"
#   git tag -a chat-bot-v0.0.2 -m "@itd-api/chat-bot 0.0.2"
#   git push --follow-tags
on:
  push:
    tags: ['chat-bot-v*']

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-workspace.yml
    with:
      package_name: '@itd-api/chat-bot'
      package_path: packages/chat-bot
      tag_prefix: chat-bot-v
