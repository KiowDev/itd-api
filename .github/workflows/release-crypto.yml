name: Публикация @itd-api/crypto в npm

# Запускается при пуше тега вида crypto-v1.2.3.
# Порядок выпуска:
#   npm version patch --workspace @itd-api/crypto --no-git-tag-version
#   git commit -am "@itd-api/crypto 0.0.2"
#   git tag crypto-v0.0.2
#   git push --follow-tags
on:
  push:
    tags: ['crypto-v*']

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-workspace.yml
    with:
      package_name: '@itd-api/crypto'
      package_path: packages/crypto
      tag_prefix: crypto-v
