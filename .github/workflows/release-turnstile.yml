name: Публикация @itd-api/turnstile в npm

# Запускается при пуше тега вида turnstile-v1.2.3.
# Порядок выпуска:
#   npm version patch --workspace @itd-api/turnstile --no-git-tag-version
#   git commit -am "@itd-api/turnstile 0.0.2"
#   git tag turnstile-v0.0.2
#   git push --follow-tags
on:
  push:
    tags: ['turnstile-v*']

jobs:
  release:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-workspace.yml
    with:
      package_name: '@itd-api/turnstile'
      package_path: packages/turnstile
      tag_prefix: turnstile-v
